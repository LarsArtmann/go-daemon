name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out go-daemon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: true

      - name: Validate workflow (actionlint)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -no-color

      - name: Build
        run: go build ./...

      - name: Check README quickstart snippet
        run: bash scripts/check-readme.sh

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1 -covermode=atomic -coverprofile=coverage.out

      - name: Coverage gate
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')"
          echo "Total statement coverage: ${total}%"
          threshold="80.0"
          if awk -v total="$total" -v threshold="$threshold" 'BEGIN { exit !(total + 0 >= threshold + 0) }'; then
            echo "Coverage ${total}% meets the ${threshold}% gate."
          else
            echo "::error::Coverage ${total}% is below the ${threshold}% gate."
            exit 1
          fi

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # v2.15.0 reads Go 1.27.4 export data; v2.13.2 dies with "export
          # data version 5 is greater than maximum supported version 4"
          # (measured 2026-11-27, run 46021629245).
          version: v2.15.0
          args: --timeout=5m

  nix:
    # The only gate that catches a stale flake vendorHash: `nix build`
    # re-derives the module hash on every run, so a dependency bump that
    # forgot the hash fails here instead of at a consumer's `nix build`.
    # All dependencies are public (no vendored-source helper needed), so
    # this needs no secrets on a public runner.
    runs-on: ubuntu-latest

    steps:
      - name: Check out go-daemon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build and check flake
        # --all-systems evaluates the outputs of every system in flake.nix's
        # `systems` list (x86_64-linux, aarch64-linux, aarch64-darwin) and
        # --no-build keeps it evaluation-only: without it Nix also tries to
        # BUILD every system's checks and dies on `platform mismatch`
        # (measured 2026-11-27 in the first public run, 46020081576). The
        # plain check skips the non-native systems with exit 0 plus a
        # warning, so it cannot catch a system nixpkgs stopped evaluating
        # (adding x86_64-darwin today passes the plain check and fails this
        # one). The native build runs first, so source and vendorHash are
        # still really built.
        run: nix build .#default && nix flake check --no-build --all-systems

      - name: Documentation health
        # The docs corpus went red for two months because no job ran this
        # (docs/status/2026-11-27_16-16 §f29). check-docs covers dprint, row
        # completeness, strike presence, and the FEATURES counts; the fuller
        # freshness/annotate battery runs in the session ritual.
        run: nix run .#check-docs
